services:
  - type: web
    name: studydash-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py  # run.py 读取 PORT 环境变量（Render 注入），HOST 默认 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-site-name.netlify.app
      - key: SECRET_KEY
        value: change-me-to-a-long-random-string
      - key: ADMIN_USERNAMES
        value: admin
      - key: INVITE_CODE
        value: your-invite-code
      # DATABASE_URL：在 Render 后台创建 PostgreSQL 后，把 Internal Database URL 填到
      # Web Service 的环境变量里（见 README「部署上线」一节）