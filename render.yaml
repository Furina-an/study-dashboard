services:
  - type: web
    name: studydash-api
    runtime: python
    rootDir: backend
    # 构建阶段：先构建前端（Render Python 运行时自带 Node/npm），再安装后端依赖
    buildCommand: cd ../frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: python run.py  # run.py 读取 PORT 环境变量（Render 注入），HOST 默认 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://studydash-api.onrender.com
      # sync: false 表示该变量不在仓库中填写，部署后在 Render 后台手动设置
      - key: SECRET_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      # DATABASE_URL：在 Render 后台创建 PostgreSQL 后，把 Internal Database URL 填入
      - key: DATABASE_URL
        sync: false
